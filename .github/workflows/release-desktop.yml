name: Release Desktop Packages

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare next development version
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Update package version and commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'apps/desktop/package.json'
          const tag = process.env.RELEASE_TAG.replace(/^v(?=\d)/i, '')
          const match = tag.match(/^(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?$/)
          if (!match) {
            throw new Error(`Invalid release tag: ${process.env.RELEASE_TAG}`)
          }
          const nextVersion = `${match[1]}.${match[2]}.${Number(match[3]) + 1}`
          const packageJson = JSON.parse(fs.readFileSync(path, 'utf8'))
          packageJson.version = nextVersion
          fs.writeFileSync(path, `${JSON.stringify(packageJson, null, 2)}\n`)
          console.log(`Preparing next desktop base version ${nextVersion}`)
          NODE

          if git diff --quiet -- apps/desktop/package.json; then
            echo 'Desktop development version is already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/package.json
          git commit -m "chore: prepare next desktop base version"
          git push origin "HEAD:${DEFAULT_BRANCH}"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage
            os: ubuntu-22.04
            command: pnpm --filter markmap-plus-plus-desktop make:linux
            artifact: desktop-linux
          - name: Windows installer and portable archive
            os: windows-latest
            command: pnpm --filter markmap-plus-plus-desktop make:win
            artifact: desktop-windows

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        env:
          MARKMAP_DESKTOP_VERSION: ${{ github.ref_name }}
        run: ${{ matrix.command }}

      - name: Upload release files
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/release/*
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Create release and upload files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          repository="${{ github.repository }}"
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find release -type f \( \
            -name '*-linux-*.AppImage' -o \
            -name '*-windows-*-setup.exe' -o \
            -name '*-windows-*-portable.7z' \
          \) -print0)

          test "${#files[@]}" -gt 0
          if ! gh release view "$tag" --repo "$repository" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$repository" --title "markmap++ $tag" --generate-notes
          else
            while IFS= read -r asset; do
              gh release delete-asset "$tag" "$asset" --repo "$repository" --yes
            done < <(gh release view "$tag" --repo "$repository" --json assets --jq '.assets[].name')
          fi
          gh release upload "$tag" "${files[@]}" --repo "$repository" --clobber
          gh release edit "$tag" --repo "$repository" --draft=false
