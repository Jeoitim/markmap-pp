<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
  <title id="title">Markdown editor and detailed mind-map workspace</title>
  <desc id="desc">A detailed markmap++ workspace with a Markdown source editor, a dotted canvas, colorful branches, tables, code and note links.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--shell-start)" />
      <stop offset="1" stop-color="var(--shell-end)" />
    </linearGradient>
    <linearGradient id="editor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--editor-start)" />
      <stop offset="1" stop-color="var(--editor-end)" />
    </linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--canvas-start)" />
      <stop offset="1" stop-color="var(--canvas-end)" />
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.35" fill="var(--grid)" />
    </pattern>
    <filter id="small-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="var(--shadow)" flood-opacity=".18" />
    </filter>
    <style>
      :root {
        --shell-start: #ffffff;
        --shell-end: #f1effa;
        --editor-start: #f6f7fb;
        --editor-end: #edf0f7;
        --canvas-start: #fbfcff;
        --canvas-end: #f1effa;
        --panel: #ffffff;
        --panel-soft: #f5f3fc;
        --text: #242735;
        --muted: #737b8e;
        --line: #d7dbe6;
        --grid: #cdd2df;
        --code: #46516c;
        --code-key: #6b52d8;
        --code-muted: #9aa2b2;
        --purple: #7056e8;
        --orange: #da7a2d;
        --green: #4b9c68;
        --red: #d95763;
        --yellow: #c79726;
        --blue: #538bb9;
        --shadow: #342174;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --shell-start: #252536;
          --shell-end: #171824;
          --editor-start: #222333;
          --editor-end: #1b1c2a;
          --canvas-start: #202132;
          --canvas-end: #171824;
          --panel: #292a3d;
          --panel-soft: #303149;
          --text: #ececff;
          --muted: #a4a7bd;
          --line: #4a4d65;
          --grid: #41455d;
          --code: #d3d6ef;
          --code-key: #b7a7ff;
          --code-muted: #8f93ad;
          --purple: #ac9af6;
          --orange: #e2a15e;
          --green: #7ec78d;
          --red: #ed8d99;
          --yellow: #e4c56c;
          --blue: #8abbe3;
          --shadow: #05050b;
        }
      }

      .shell { fill: url(#shell); stroke: var(--line); stroke-width: 1.5; }
      .panel { stroke: var(--line); stroke-width: 1; }
      .caption { fill: var(--muted); font: 700 11px Inter, Arial, sans-serif; letter-spacing: 1.5px; }
      .brand { fill: var(--text); font: 800 16px Inter, Arial, sans-serif; letter-spacing: -.5px; }
      .toolbar { fill: var(--muted); font: 600 10px Inter, Arial, sans-serif; }
      .line-number { fill: var(--code-muted); font: 11px 'SFMono-Regular', Consolas, monospace; }
      .code { fill: var(--code); font: 14px 'SFMono-Regular', Consolas, monospace; }
      .code-small { fill: var(--code); font: 12px 'SFMono-Regular', Consolas, monospace; }
      .code-key { fill: var(--code-key); font: 14px 'SFMono-Regular', Consolas, monospace; }
      .code-muted { fill: var(--code-muted); font: 14px 'SFMono-Regular', Consolas, monospace; }
      .map-label-small { fill: var(--muted); font: 500 10px Inter, Arial, sans-serif; }
      .map-node { fill: var(--panel); stroke-width: 2; }
      .branch { fill: none; stroke-linecap: round; stroke-width: 2.7; }
      .branch-thin { fill: none; stroke-linecap: round; stroke-width: 1.7; }
      .card { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
      .card-header { fill: var(--panel-soft); stroke: var(--line); stroke-width: 1; }
      .card-text { fill: var(--text); font: 600 10px Inter, Arial, sans-serif; }
      .card-muted { fill: var(--muted); font: 500 9px Inter, Arial, sans-serif; }
      .formula { fill: var(--text); font: italic 13px Georgia, serif; }
      .selection { fill: var(--purple); fill-opacity: .13; stroke: var(--purple); stroke-opacity: .3; }
      .button { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
      .button-icon { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="shell" x="12" y="12" width="936" height="546" rx="30" />
  <rect x="12" y="12" width="936" height="58" rx="30" fill="var(--panel)" />
  <path d="M12 70h936" stroke="var(--line)" />

  <g transform="translate(34 27)">
    <rect width="30" height="30" rx="8" fill="var(--purple)" />
    <circle cx="9" cy="15" r="2.5" fill="#fff" />
    <circle cx="21" cy="8" r="2.5" fill="#fff" />
    <circle cx="21" cy="22" r="2.5" fill="#fff" />
    <path d="M11 14l7-5M11 16l7 5" stroke="#fff" stroke-width="2" stroke-linecap="round" />
  </g>
  <text class="brand" x="76" y="47">markmap<tspan fill="var(--purple)">++</tspan></text>
  <circle cx="213" cy="40" r="4" fill="var(--green)" />
  <text class="toolbar" x="224" y="38">Markdown workspace</text>
  <text class="map-label-small" x="224" y="52">live preview · local first</text>
  <g transform="translate(796 29)">
    <rect class="button" width="34" height="26" rx="8" />
    <path class="button-icon" d="M10 13h14M17 7v12M12 10l-2 3 2 3M22 10l2 3-2 3" />
    <rect class="button" x="42" width="34" height="26" rx="8" />
    <circle cx="53" cy="13" r="5" fill="none" stroke="var(--muted)" stroke-width="1.5" />
    <path class="button-icon" d="M60 8v10M56 13h8" />
  </g>

  <rect class="panel" x="28" y="88" width="350" height="450" rx="18" fill="url(#editor)" />
  <rect class="panel" x="396" y="88" width="532" height="450" rx="18" fill="url(#canvas)" />
  <rect x="396" y="88" width="532" height="450" rx="18" fill="url(#dots)" opacity=".75" />

  <text class="caption" x="52" y="118">MARKDOWN EDITOR</text>
  <text class="toolbar" x="52" y="137">source mode</text>
  <circle cx="348" cy="111" r="4" fill="var(--green)" />
  <path d="M48 151h310" stroke="var(--line)" />
  <rect x="48" y="162" width="30" height="354" rx="5" fill="var(--panel-soft)" opacity=".72" />
  <path d="M83 162h1v354" stroke="var(--line)" />

  <g class="line-number" text-anchor="middle">
    <text x="63" y="183">1</text><text x="63" y="205">2</text><text x="63" y="227">3</text><text x="63" y="249">4</text>
    <text x="63" y="271">5</text><text x="63" y="293">6</text><text x="63" y="315">7</text><text x="63" y="337">8</text>
    <text x="63" y="359">9</text><text x="63" y="381">10</text><text x="63" y="403">11</text><text x="63" y="425">12</text>
    <text x="63" y="447">13</text><text x="63" y="469">14</text><text x="63" y="491">15</text>
  </g>
  <text class="code-muted" x="94" y="183">---</text>
  <text class="code-key" x="94" y="205">title:</text><text class="code" x="150" y="205">markmap++ guide</text>
  <text class="code-key" x="94" y="227">options:</text>
  <text class="code-small" x="106" y="249">colorFreezeLevel: 2</text>
  <text class="code-muted" x="94" y="271">---</text>
  <text class="code-key" x="94" y="315"># markmap++</text>
  <text class="code-key" x="94" y="359">## Welcome</text>
  <text class="code" x="106" y="381">- edit Markdown on the left</text>
  <text class="code" x="106" y="403">- inspect the map on the right</text>
  <text class="code" x="106" y="425">- keep links, tables and notes</text>
  <rect x="106" y="440" width="2" height="18" rx="1" fill="var(--purple)" />
  <rect x="94" y="474" width="156" height="24" rx="6" fill="var(--panel-soft)" />
  <circle cx="107" cy="486" r="4" fill="var(--green)" />
  <text class="toolbar" x="118" y="490">WYSIWYG available</text>

  <text class="caption" x="420" y="118">LIVE MIND MAP</text>
  <text class="toolbar" x="420" y="137">canvas preview</text>
  <g transform="translate(858 105)">
    <rect class="button" width="28" height="25" rx="7" />
    <path class="button-icon" d="M14 7v11M9 12h10M10 9l-2 3 2 3M18 9l2 3-2 3" />
    <rect class="button" x="34" width="28" height="25" rx="7" />
    <path class="button-icon" d="M43 8h10M43 13h10M43 18h10M47 6v4M50 11v4M46 16v4" />
  </g>

  <path class="branch" d="M482 308 C520 308 526 186 572 186" stroke="var(--orange)" />
  <path class="branch" d="M482 308 C530 308 538 274 590 274" stroke="var(--green)" />
  <path class="branch" d="M482 308 C530 308 538 362 590 362" stroke="var(--red)" />
  <path class="branch" d="M482 308 C530 308 538 452 590 452" stroke="var(--purple)" />
  <path class="branch-thin" d="M612 186 C650 186 656 148 706 148" stroke="var(--orange)" />
  <path class="branch-thin" d="M612 186 C650 186 656 214 706 214" stroke="var(--yellow)" />
  <path class="branch-thin" d="M630 274 C666 274 676 254 716 254" stroke="var(--green)" />
  <path class="branch-thin" d="M630 274 C666 274 676 294 716 294" stroke="var(--blue)" />
  <path class="branch-thin" d="M630 362 C666 362 676 336 716 336" stroke="var(--red)" />
  <path class="branch-thin" d="M630 362 C666 362 676 388 716 388" stroke="var(--red)" />
  <path class="branch-thin" d="M630 452 C666 452 676 430 716 430" stroke="var(--purple)" />
  <path class="branch-thin" d="M630 452 C666 452 676 480 716 480" stroke="var(--purple)" />

  <g filter="url(#small-shadow)">
    <circle cx="462" cy="308" r="30" fill="var(--panel)" stroke="var(--purple)" stroke-width="2.5" />
    <circle cx="462" cy="308" r="22" fill="var(--purple)" />
    <path d="M451 308h22M462 297v22" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <g>
    <circle class="map-node" cx="590" cy="186" r="11" stroke="var(--orange)" />
    <circle class="map-node" cx="610" cy="274" r="11" stroke="var(--green)" />
    <circle class="map-node" cx="610" cy="362" r="11" stroke="var(--red)" />
    <circle class="map-node" cx="610" cy="452" r="11" stroke="var(--purple)" />
  </g>

  <g>
    <circle cx="720" cy="148" r="3" fill="var(--orange)" /><text class="map-label-small" x="730" y="151">real-time preview</text>
    <circle cx="720" cy="214" r="3" fill="var(--yellow)" /><text class="map-label-small" x="730" y="217">links and notes</text>
    <circle cx="730" cy="254" r="3" fill="var(--green)" /><text class="map-label-small" x="740" y="257">GitHub sync</text>
    <circle cx="730" cy="294" r="3" fill="var(--blue)" /><text class="map-label-small" x="740" y="297">local workspace</text>
    <circle cx="730" cy="336" r="3" fill="var(--red)" /><text class="map-label-small" x="740" y="339">rich Markdown</text>
    <circle cx="730" cy="388" r="3" fill="var(--red)" /><text class="map-label-small" x="740" y="391">Mermaid blocks</text>
    <circle cx="730" cy="430" r="3" fill="var(--purple)" /><text class="map-label-small" x="740" y="433">reviewable edits</text>
    <circle cx="730" cy="480" r="3" fill="var(--purple)" /><text class="map-label-small" x="740" y="483">knowledge context</text>
  </g>

  <g filter="url(#small-shadow)">
    <rect class="card" x="722" y="157" width="174" height="76" rx="9" />
    <rect class="card-header" x="722" y="157" width="174" height="21" rx="9" />
    <path d="M722 178h174" stroke="var(--line)" />
    <text class="card-text" x="733" y="172">Symbol</text><text class="card-text" x="786" y="172">Action</text>
    <text class="card-muted" x="733" y="194">●</text><text class="card-muted" x="786" y="194">select node</text>
    <text class="card-muted" x="733" y="210">↔</text><text class="card-muted" x="786" y="210">drag canvas</text>
    <text class="card-muted" x="733" y="226">⌘</text><text class="card-muted" x="786" y="226">edit text</text>
  </g>

  <g filter="url(#small-shadow)">
    <rect class="card" x="748" y="345" width="148" height="57" rx="9" />
    <text class="card-muted" x="760" y="362">table</text>
    <path d="M760 369h124M760 381h124M800 369v23M842 369v23" stroke="var(--line)" />
    <rect x="766" y="372" width="7" height="5" rx="1" fill="var(--green)" />
    <rect x="808" y="372" width="22" height="5" rx="1" fill="var(--panel-soft)" />
    <rect x="850" y="372" width="21" height="5" rx="1" fill="var(--panel-soft)" />
  </g>

  <g filter="url(#small-shadow)">
    <rect class="card" x="680" y="498" width="216" height="29" rx="7" />
    <text class="formula" x="693" y="518">A = πr²</text>
    <text class="card-muted" x="754" y="517">code · formula · checklist</text>
  </g>
</svg>
